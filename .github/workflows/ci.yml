name: Test NotWWE
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: notwwe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run scenarios
      - run: npm run pacing
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: notwwe-candidate
          path: |
            dist/
            artifacts/
